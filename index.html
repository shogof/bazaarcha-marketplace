<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazaarcha – Afghan Girls' Handicrafts</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- ========== HEADER ========== -->
    <header class="header">
      <div class="logo">
        <img src="images/logo.png" alt="Bazaarcha Logo" id="logo-img" />
      </div>
      <nav class="nav">
        <a href="#home" class="nav-link" data-key="navHome">Home</a>
        <a href="#about" class="nav-link" data-key="navAbout">About</a>
        <a href="#products" class="nav-link" data-key="navProducts">Products</a>
        <a href="#contact" class="nav-link" data-key="navContact">Contact</a>
      </nav>
      <div class="language-selector">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="prs">دری</button>
        <button class="lang-btn" data-lang="ps">پښتو</button>
      </div>
    </header>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
    </footer>

    <div id="toastMsg" class="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
